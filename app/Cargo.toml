[package]
name = "monitor-control-center"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Monitor Control Center: control every monitor separately, even identical ones (Windows display number + device instance id)"

[[bin]]
name = "monitor-control-center"
path = "src/main.rs"

[dependencies]
eframe = "=0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1"
