[package]
name = "legion-monitor-control"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Monitor control center that tells identical monitors apart (Windows display number + device instance id)"

[[bin]]
name = "legion-monitor-control"
path = "src/main.rs"

[dependencies]
eframe = "=0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1"
